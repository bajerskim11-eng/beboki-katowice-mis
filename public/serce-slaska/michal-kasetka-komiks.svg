<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="t d"><title id="t">Michał i kasetka — komiks</title><desc id="d">Cztery mroczne kadry: Michał znajduje kasetkę w piwnicy, odkrywa znak, ogląda fotografię górników i czyta wiadomość dziadka.</desc><defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#1a1510"/><stop offset="1" stop-color="#080706"/></linearGradient><linearGradient id="paper"><stop stop-color="#d9c08d"/><stop offset="1" stop-color="#a88b58"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="1200" height="900" fill="url(#bg)"/><g stroke="#c8a76a" stroke-width="5" fill="none"><rect x="28" y="28" width="560" height="400"/><rect x="612" y="28" width="560" height="400"/><rect x="28" y="456" width="560" height="416"/><rect x="612" y="456" width="560" height="416"/></g><g fill="#e8dcc4" font-family="Georgia,serif" font-size="26"><text x="55" y="75">I — PIWNICA</text><text x="639" y="75">II — ZNAK</text><text x="55" y="503">III — FOTOGRAFIA</text><text x="639" y="503">IV — WIADOMOŚĆ</text></g><g stroke="#b99559" stroke-width="8" fill="#201912"><path d="M90 350 Q150 160 255 130 Q340 170 360 350Z"/><circle cx="220" cy="170" r="52" fill="#30261b"/><path d="M180 225 L145 330 M260 225 L315 330"/><rect x="390" y="265" width="130" height="75" rx="10" fill="url(#paper)" stroke="#5e472b"/><path d="M400 270 l55 -35 55 35" fill="none"/><circle cx="455" cy="305" r="7" fill="#5e472b"/><path d="M455 240 v-35 M438 205 h34"/></g><g transform="translate(650 105)" stroke="#c7a263" stroke-width="9" fill="none"><path d="M250 55v190"/><path d="M205 245 L295 245"/><path d="M205 245 L170 315 M295 245 L330 315"/><path d="M250 80 q-70 20 -70 75 q0 55 70 75 q70 -20 70 -75 q0 -55 -70 -75Z"/><path d="M180 185 L320 185 M250 130 L250 240"/></g><g transform="translate(70 535)"><rect width="480" height="270" rx="8" fill="#cbb487" stroke="#6b5130" stroke-width="8"/><g stroke="#6b5130" stroke-width="6"><circle cx="240" cy="135" r="70" fill="none"/><path d="M185 185 L295 75 M185 75 L295 185"/><path d="M240 65 V205"/></g><g fill="#403020" font-family="Georgia,serif" font-size="20"><text x="25" y="35">KATOWICE, 1911</text><text x="25" y="245">SZEŚCIU GÓRNIKÓW</text></g></g><g transform="translate(660 545)"><rect width="465" height="275" fill="#d8c394" stroke="#725534" stroke-width="8"/><g fill="#493723" font-family="cursive" font-size="26"><text x="28" y="62">Michał, jeśli kiedyś</text><text x="28" y="102">to znajdziesz,</text><text x="28" y="142">pamiętaj:</text><text x="28" y="182">światło pokaże drogę,</text><text x="28" y="222">ale cień otworzy drzwi.</text></g><path d="M390 25 q30 25 0 50" stroke="#725534" stroke-width="5" fill="none"/></g><g fill="#e1bd73" font-family="Georgia,serif" font-size="22"><text x="55" y="410">„A w niej — coś, czego nie powinno tam być.”</text><text x="640" y="410">„Kaganek. Skrzyżowane narzędzia. I cień.”</text><text x="55" y="855">„Nazwisko na fotografii było jego nazwiskiem.”</text><text x="640" y="855">„To dopiero początek.”</text></g><circle cx="460" cy="245" r="16" fill="#d9b36a" filter="url(#glow)"/><circle cx="890" cy="260" r="12" fill="#8cc8d6" filter="url(#glow)"/></svg>