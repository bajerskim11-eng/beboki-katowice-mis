<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><rect width="1200" height="800" fill="#0b0a08"/><g stroke="#b58b4b" stroke-width="4" fill="#17130f"><rect x="25" y="25" width="560" height="350"/><rect x="615" y="25" width="560" height="350"/><rect x="25" y="400" width="560" height="375"/><rect x="615" y="400" width="560" height="375"/></g><g fill="#e9ddc5" font-family="Georgia,serif"><text x="50" y="70" font-size="28" fill="#d4ad62">I — STARA GWARDIA</text><text x="50" y="105" font-size="20">Beton pęka. Natura wraca po swoje.</text><path d="M60 325 L130 180 220 245 315 150 450 220 550 130" stroke="#5f6558" stroke-width="20" fill="none"/><path d="M80 320q40-120 80 0M210 320q40-150 80 0M370 320q50-170 100 0" stroke="#345038" stroke-width="28" fill="none"/><circle cx="430" cy="210" r="35" fill="#20241e"/><text x="645" y="70" font-size="28" fill="#d4ad62">II — HIP. HOP.</text><text x="645" y="110" font-size="22">Trzy razy. Trzy odpowiedzi.</text><text x="665" y="180" font-size="52" fill="#d4ad62">HIP.</text><text x="825" y="180" font-size="52">HOP.</text><text x="665" y="245" font-size="52">HIP.</text><text x="825" y="245" font-size="52">HOP.</text><text x="665" y="310" font-size="52">HIP.</text><text x="825" y="310" font-size="52">HOP.</text><text x="970" y="335" font-size="28" fill="#8cc8d6">STUK.</text><text x="50" y="445" font-size="28" fill="#d4ad62">III — MICHAŁ SŁYSZY</text><path d="M90 680q110-170 220 0" stroke="#8cc8d6" stroke-width="5" fill="none"/><path d="M180 500v120M140 535l40-25 40 25" stroke="#c79a52" stroke-width="7"/><circle cx="180" cy="500" r="28" fill="#c79a52"/><text x="260" y="530" font-size="22">Wiatr.</text><text x="260" y="570" font-size="22">Serce.</text><text x="260" y="610" font-size="22">Beton.</text><text x="260" y="650" font-size="22">Kopalnia.</text><text x="260" y="690" font-size="22">Ten sam wzór.</text><text x="645" y="445" font-size="28" fill="#d4ad62">IV — SKARBNIK</text><text x="645" y="485" font-size="20">Postać pozostaje niewidoczna.</text><path d="M820 700V550q0-90 95-90t95 90v150" fill="#050504" stroke="#8cc8d6" stroke-width="5"/><circle cx="875" cy="555" r="5" fill="#8cc8d6"/><circle cx="955" cy="555" r="5" fill="#8cc8d6"/><text x="680" y="745" font-size="21" fill="#c8b99d">Nie widzisz go. Słyszysz odpowiedź.</text></g></svg>