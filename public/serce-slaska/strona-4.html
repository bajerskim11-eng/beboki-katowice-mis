czego właściwie się boi.</text><text x="55" y="177" font-size="20">Brama była teraz wyraźna. Powstała z cienia.</text></g><g transform="translate(430 120)"><ellipse cx="170" cy="145" rx="240" ry="180" fill="url(#green)" filter="url(#glow)"/><path d="M45 310V100Q45 35 170 35T295 100V310" fill="#171714" stroke="#718c68" stroke-width="8"/><path d="M105 270V125Q105 85 170 85T235 125V270" fill="#050504" stroke="#91c77c" stroke-width="5"/><circle cx="170" cy="55" r="12" fill="#a9e6a2"/><path d="M170 85v90m-60 30h120M110 205l-42 65m102-65 42 65" stroke="#c79a52" stroke-width="10"/><path d="M40 315q120-70 260 0" stroke="#8fc5b7" stroke-width="5" opacity=".8"/></g><g fill="#e9dfcc" font-family="Georgia,serif" font-size="22"><text x="55" y="350">Kaganek drżał w jego dłoni. Płomień również.</text></g><g transform="translate(50 430)"><circle cx="120" cy="100" r="72" fill="#2b241c"/><path d="M60 180q60-60 120 0l55 105H15z" fill="#181512"/><circle cx="115" cy="95" r="8" fill="#c79a52"/><path d="M250 240Q310 170 365 230T480 220" fill="none" stroke="#b7c7bf" stroke-width="13" opacity=".55"/><text x="20" y="315" fill="#e9dfcc" font-size="22" font-family="Georgia">Wtedy usłyszał wiatr. Nie powinno go tu być.</text></g><g transform="translate(620 430)"><rect x="0" y="0" width="500" height="285" fill="#b69c70" stroke="#5b4328" stroke-width="10"/><g transform="translate(70 45)" fill="#35291e"><circle cx="180" cy="95" r="62"/><path d="M100 190q80-70 160 0v25H100z"/><circle cx="180" cy="93" r="8" fill="#c79a52"/></g><path d="M80 220Q250 40 420 220" fill="none" stroke="#314e3d" stroke-width="12"/><text x="25" y="260" font-size="21" font-family="Georgia">Za nimi również była Brama.</text></g><g fill="#e9dfcc" font-family="Georgia" font-size="21"><text x="55" y="790">Na zdjęciu dziewięciu górników stało przed szybem.</text><text x="55" y="822">Za nimi — ta sama Brama. Tylko że na fotografii była otwarta.</text><text x="620" y="790">Michał odwrócił fotografię.</text><text x="620" y="822">Na odwrocie pojawiło się jedno zdanie.</text></g><g transform="translate(60 850)"><rect width="485" height="190" rx="5" fill="#d7c397"/><text x="25" y="55" fill="#463728" font-size="25" font-family="Georgia">„Nie szukaj Skarbnika.”</text><text x="25" y="100" fill="#463728" font-size="21" font-family="Georgia">„Jeżeli znalazłeś Bramę,</text><text x="25" y="135" fill="#463728" font-size="21" font-family="Georgia">on już znalazł ciebie.”</text></g><g transform="translate(640 850)"><rect width="480" height="190" fill="#0a0908"/><text x="25" y="55" fill="#c79a52" font-size="22" font-family="Georgia">Płomień zgasł.</text><text x="25" y="92" fill="#e9dfcc" font-size="21" font-family="Georgia">Michał zobaczył tylko ciemność.</text><text x="25" y="145" fill="#a7d2c9" font-size="30" font-family="Georgia">— Michał.</text></g><g transform="translate(55 1130)"><path d="M0 55h500M0 145h500M0 235h500" stroke="#332a20" stroke-width="4"/><text x="30" y="40" fill="#c79a52" font-size="26" font-family="Georgia">STUK.</text><text x="30" y="130" fill="#c79a52" font-size="26" font-family="Georgia">STUK.</text><text x="30" y="220" fill="#c79a52" font-size="26" font-family="Georgia">STUK.</text><text x="30" y="285" fill="#e9dfcc" font-size="20" font-family="Georgia">Gdzieś na górze. W ścianie. Pod podłogą.</text></g><g transform="translate(620 1120)"><ellipse cx="260" cy="170" rx="260" ry="220" fill="url(#green)"/><path d="M90 360V120Q90 55 260 55T430 120V360" fill="#050504" stroke="#5f8d6b" stroke-width="7"/><path d="M185 360V170Q185 115 260 115T335 170V360" fill="#020202"/><path d="M225 205q35-30 70 0v75h-70z" fill="#080706"/><circle cx="245" cy="230" r="5" fill="#c79a52"/><circle cx="275" cy="230" r="5" fill="#c79a52"/><text x="80" y="395" fill="#a7d2c9" font-size="24" font-family="Georgia">Zza Bramy dobiegł śmiech.</text></g></svg></div><p>Ta plansza celowo nie pokazuje twarzy Skarbnika. Jest obecnością: cieniem, wiatrem, głosem i czymś stojącym po drugiej stronie Bramy.</p></main></body></
